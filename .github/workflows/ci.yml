name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    name: 依赖安全
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: backend/go.sum
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            admin-web/package-lock.json
            wxapp/package-lock.json
      - name: 扫描依赖漏洞
        run: make check-dependencies

  backend:
    name: 后端与迁移
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      WPLINK_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/wplink_integration?sslmode=disable
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: backend/go.sum
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验迁移与 API 契约
        working-directory: backend
        run: node --test scripts/validate_migrations.test.mjs scripts/api_contract.test.mjs scripts/product_doc_governance.test.mjs
      - name: 动态验证迁移回滚
        working-directory: backend
        run: go run ./scripts/verify_migrations.go
      - name: 准备 PostgreSQL 集成测试库
        working-directory: backend
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE wplink_integration'
          for file in migrations/*.up.sql; do
            psql "$WPLINK_TEST_POSTGRES_DSN" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: 运行 PostgreSQL 并发集成测试
        run: make check-postgres
      - name: 运行后端测试
        working-directory: backend
        run: go test ./...
      - name: 运行静态检查
        working-directory: backend
        run: go vet ./...

  frontend:
    name: 管理后台与小程序
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            admin-web/package-lock.json
            wxapp/package-lock.json
      - name: 安装管理后台依赖
        run: npm ci --prefix admin-web
      - name: 安装小程序依赖
        run: npm ci --prefix wxapp
      - name: 检查并构建管理后台
        run: npm --prefix admin-web run check
      - name: 检查并构建小程序
        run: npm --prefix wxapp run check
